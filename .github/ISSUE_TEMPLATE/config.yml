blank_issues_enabled: false
contact_links:
  - name: Help deploying or using the Railway template
    url: https://station.railway.com/
    about: Open the Crawl4AI template page on railway.com and click "Discuss this Template". Questions posted there reach the maintainer's template queue.
  - name: Crawl4AI crawler or API bug
    url: https://github.com/unclecode/crawl4ai/issues
    about: Bugs in Crawl4AI itself (crawling results, API behavior, Docker image internals) belong upstream.
  - name: Report a security vulnerability
    url: https://github.com/salmanalfariz24/crawl4ai-railway/security/advisories/new
    about: Report security problems privately. Do not open a public issue.
